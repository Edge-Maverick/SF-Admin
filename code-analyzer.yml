# Salesforce Code Analyzer Configuration
# (NOTE: "version: v1" was removed because it causes errors in v5)

# 1. Global Settings
log_folder: .sfdx/scanner/logs

# 2. Rule Overrides
rules:
  # --- PMD (Apex) Overrides ---
  pmd:
    # Disable Variable Naming Conventions
    VariableNamingConventions:
      severity: 5       # Info
      tags: ["Style"]   # Removed "Recommended"

    # Disable Method Naming Conventions
    MethodNamingConventions:
      severity: 5
      tags: ["Style"]

    # Disable Formal Parameter Naming
    FormalParameterNamingConventions:
      severity: 5
      tags: ["Style"]

    # Relax Complexity Rule
    ExcessivePublicCount:
      severity: 3
      tags: ["Recommended", "Complexity"]

  # --- ESLint (LWC/JS) Overrides ---
  eslint:
    # Disable "no-console"
    no-console:
      severity: 5
      tags: ["Style"]

# 3. Engine Configuration
engines:
  eslint:
    auto_discover_eslint_config: true
