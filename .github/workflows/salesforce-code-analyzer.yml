name: Salesforce Code Analyzer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  scan-code:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Salesforce Code Analyzer
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --target ./force-app --format sarif --outfile CodeAnalyzerResults.sarif

      - name: Upload Scan Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-code-analyzer-results
          path: CodeAnalyzerResults.sarif

      - name: Upload SARIF to GitHub
        if: success()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: CodeAnalyzerResults.sarif
          category: salesforce-code-analyzer
