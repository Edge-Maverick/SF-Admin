name: Salesforce Code Analyzer Debug

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  scan-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # DEBUG STEP: This prints the folder structure to the logs
      - name: Debug - List Files
        run: |
          echo "Current working directory:"
          pwd
          echo "Listing root files:"
          ls -la
          echo "Checking if force-app exists:"
          if [ -d "./force-app" ]; then
            echo "force-app FOUND"
            ls -R force-app
          else
            echo "ERROR: force-app NOT FOUND. Do you use 'src' or another name?"
          fi

      - name: Run Salesforce Code Analyzer
        uses: forcedotcom/run-code-analyzer@v2
        with:
          # Minimized arguments to reduce errors. 
          # We removed '--outfile' so it defaults to the standard output to avoid path issues.
          run-arguments: --target ./force-app --normalize-severity --verbose
